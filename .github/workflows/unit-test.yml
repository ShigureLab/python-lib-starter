name: Unit Test

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15', '3.15t']
        architecture: ['x64']
    name: unittest - Python ${{ matrix.python-version }} on ${{ matrix.architecture }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_LOCKED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          allow-prereleases: true

      - name: Install just
        uses: extractions/setup-just@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          just ci-install

      - name: Verify Python runtime
        run: |
          uv run python - <<'PY'
          import os
          import sys
          import sysconfig

          requested = os.environ["UV_PYTHON"]
          assert f"{sys.version_info.major}.{sys.version_info.minor}" == requested.removesuffix("t")
          if requested.endswith("t"):
              assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1
              assert not sys._is_gil_enabled()
          print(sys.version)
          PY

      - name: unit test
        run: |
          just ci-test
